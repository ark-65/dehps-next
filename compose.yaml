name: dehps-next-p0p1
x-app: &app
  image: dehps-next:p0p1
  build: .
  env_file: .env
  environment:
    DEHPS_NEXT_RUNTIME: /app/runtime/application
    DEHPS_NEXT_THREADS: "2"
    DEHPS_NEXT_QUOTA_MIB: "1024"
    OPENBLAS_NUM_THREADS: "2"
    OMP_NUM_THREADS: "2"
    MKL_NUM_THREADS: "2"
    DEHPS_NEXT_RESEARCH_URL: http://next-inference:11434
    DEHPS_NEXT_RESEARCH_MODEL: qwen3:1.7b
  volumes:
    - ./runtime/application:/app/runtime/application
    - ./runtime/host:/app/runtime/host:ro
  networks: [next]
  read_only: true
  tmpfs: ["/tmp:size=64m"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 2g
  cpus: 2
  restart: unless-stopped
  logging:
    driver: local
    options: {max-size: "5m", max-file: "3"}
  depends_on:
    database: {condition: service_healthy}
services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: dehps_next
      POSTGRES_DB: dehps_next
      POSTGRES_PASSWORD: ${DEHPS_NEXT_DB_PASSWORD:?Run scripts/bootstrap-secrets.py}
    volumes: ["next_pgdata:/var/lib/postgresql/data"]
    networks:
      next: {aliases: [next-database]}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    command: ["postgres", "-c", "max_wal_size=256MB", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dehps_next -d dehps_next"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: local
      options: {max-size: "5m", max-file: "3"}
  worker:
    <<: *app
    command: [worker, --role, compute]
  planner:
    <<: *app
    command: [worker, --role, planning]
    mem_limit: 1g
    cpus: 1
  steward:
    <<: *app
    command: [steward]
    mem_limit: 512m
    cpus: 0.5
  source:
    <<: *app
    command: [watch-source, --interval, "900"]
    mem_limit: 512m
    cpus: 0.5
  reporter:
    <<: *app
    command: [reporter]
    env_file:
      - .env
      - path: .mail.env
        required: false
    mem_limit: 512m
    cpus: 0.5
  api:
    <<: *app
    command: [serve, --port, "8341"]
    ports: ["127.0.0.1:8341:8341"]
    mem_limit: 512m
    cpus: 0.5
networks:
  next:
    external: true
    name: dehps-next-p0p1
volumes:
  next_pgdata:
