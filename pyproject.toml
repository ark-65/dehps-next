[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dehps-next"
version = "0.1.0"
description = "Versioned red/blue-ball learning with honest prequential evidence"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "torch>=2.6,<3", "psycopg[binary,pool]>=3.2,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "httpx>=0.27,<1"]

[project.scripts]
dehps-next = "dehps_next.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dehps_next = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
