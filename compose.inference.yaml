# Start only after installing and digest-verifying the selected local model.
services:
  inference:
    image: ollama/ollama@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    container_name: dehps-next-inference
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_VULKAN: "0"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "4"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes: ["./runtime/inference:/root/.ollama"]
    networks:
      next: {aliases: [next-inference]}
    ports: ["127.0.0.1:11435:11434"]
    mem_limit: 6g
    cpus: 4
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: local
      options: {max-size: "5m", max-file: "2"}
