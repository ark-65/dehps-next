# Start only after installing and digest-verifying the selected local model.
services:
  inference:
    image: ollama/ollama@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    container_name: dehps-next-inference
    cpuset: "0-19"
    cgroup_parent: dehpsnext.slice
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_VULKAN: "1"
      OLLAMA_IGPU_ENABLE: "1"
      GGML_VK_VISIBLE_DEVICES: "0"
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/intel_icd.json
      XDG_CACHE_HOME: /tmp/ollama-cache
      MESA_SHADER_CACHE_MAX_SIZE: "256M"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "4"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes: ["./runtime/inference:/root/.ollama"]
    devices: ["/dev/dri/renderD128:/dev/dri/renderD128"]
    read_only: true
    tmpfs: ["/tmp:rw,size=512m"]
    networks:
      next: {aliases: [next-inference]}
    ports: ["127.0.0.1:11435:11434"]
    mem_limit: 6g
    cpus: 4
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: local
      options: {max-size: "5m", max-file: "2"}
