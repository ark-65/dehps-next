name: Manual P1 legacy integrity
on: workflow_dispatch
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dehps_next
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: dehps_next_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U dehps_next" --health-interval 5s --health-retries 20
    env:
      DEHPS_NEXT_TEST_DATABASE_URL: postgresql://dehps_next:ci-only-test-password@127.0.0.1:5432/dehps_next_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          grep '^torch==' requirements.lock > /tmp/torch.lock
          grep -v '^torch==' requirements.lock > /tmp/base.lock
          pip install --no-deps --index-url https://download.pytorch.org/whl/cpu -r /tmp/torch.lock
          pip install -r /tmp/base.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - run: ruff check src tests scripts
      - run: python -m compileall -q src
      - run: pytest -q
